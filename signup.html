<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Family Account – ElderCare | Care Designed Around Every Senior</title>
  <meta name="description" content="Create your ElderCare family account to register your loved one and access personalized daily care services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/booking.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    (function(){
      var t = localStorage.getItem('eldercare-theme') || 'light';
      var d = localStorage.getItem('eldercare-direction') || 'ltr';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.dir = d;
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/logo/logo.png?v=2">
  <link rel="apple-touch-icon" href="assets/logo/logo.png?v=2">
</head>
<body>
  <main id="main-content">
    <section class="auth-section">
      <div class="auth-bg-decor" aria-hidden="true"></div>
      <div class="auth-bg-decor-2" aria-hidden="true"></div>

      <div class="auth-wrapper">
        <a href="index.html" class="auth-back-link">
          <span class="auth-back-arrow" aria-hidden="true">←</span>
          <span>Back to Home</span>
        </a>
        <a href="index.html" class="auth-logo-link" aria-label="ElderCare Homepage">
          <img class="auth-logo" src="assets/logo/logo.png" alt="ElderCare logo" data-light-src="assets/logo/logo.png" data-dark-src="assets/logo/logo.png" />
          <div class="auth-brand-text">
            <span class="auth-brand-name">ElderCare</span>
          </div>
        </a>

        <div class="auth-card">

          <div class="booking-form-header" style="text-align: center; margin-bottom: 1.8rem;">
            <span class="section-eyebrow">FAMILY REGISTRATION</span>
            <h1 class="auth-card-heading">Let's Get Started</h1>
            <p class="auth-card-desc">Create your family account to continue with your ElderCare service booking.</p>
          </div>

          <form id="signupForm" novalidate>
            <div class="form-group" style="margin-bottom: 1.1rem;">
              <label class="form-label" for="signupName">Full Name <span class="req">*</span></label>
              <input type="text" id="signupName" class="form-input" placeholder="e.g. Anitha Sharma" autocomplete="name">
              <span class="form-error" id="signupNameError"></span>
            </div>

            <div class="form-group" style="margin-bottom: 1.1rem;">
              <label class="form-label" for="signupEmail">Email Address <span class="req">*</span></label>
              <input type="email" id="signupEmail" class="form-input" placeholder="anitha@example.com" autocomplete="email">
              <span class="form-error" id="signupEmailError"></span>
            </div>

            <div class="form-group" style="margin-bottom: 1.1rem;">
              <label class="form-label" for="signupPhone">Phone Number <span class="req">*</span></label>
              <input type="tel" id="signupPhone" class="form-input" placeholder="+91 98765 43210" autocomplete="tel">
              <span class="form-error" id="signupPhoneError"></span>
            </div>

            <div class="form-grid-2" style="margin-bottom: 1.3rem;">
              <div class="form-group">
                <label class="form-label" for="signupPassword">Password <span class="req">*</span></label>
                <input type="password" id="signupPassword" class="form-input" placeholder="Min 6 chars" autocomplete="new-password">
                <span class="form-error" id="signupPasswordError"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="signupConfirmPassword">Confirm <span class="req">*</span></label>
                <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Re-enter password" autocomplete="new-password">
                <span class="form-error" id="signupConfirmPasswordError"></span>
              </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn" id="signupSubmitBtn">
              <span>Create Account</span>
              <svg class="btn-icon-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="10" x2="16" y2="10"/><polyline points="10 4 16 10 10 16"/></svg>
            </button>
          </form>

          <div class="auth-social">
            <p class="auth-social-label">Continue with</p>
            <div class="auth-social-buttons">
              <button class="auth-social-button" type="button" disabled aria-label="Google sign-in demo only">
                <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.67 5.95c4.48-4.13 7.1-10.2 7.1-17.6Z"/>
                  <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19Z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.68-5.95c-2.13 1.43-4.85 2.28-8.22 2.28-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                </svg>
                <span>Google</span>
              </button>
              <button class="auth-social-button" type="button" disabled aria-label="Facebook sign-in demo only">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.875 11.85v-8.38H7.08V12h3.045V9.36c0-3.005 1.79-4.665 4.53-4.665 1.312 0 2.685.234 2.685.234v2.953h-1.512c-1.49 0-1.953.925-1.953 1.874V12h3.322l-.531 3.47h-2.791v8.38A12 12 0 0 0 24 12Z"/>
                </svg>
                <span>Facebook</span>
              </button>
            </div>
            <p class="auth-social-note">Social sign-in is not configured for this demo.</p>
          </div>

          <div class="auth-divider">
            <span class="auth-divider-text">ALREADY REGISTERED?</span>
          </div>

          <p class="auth-switch-text">
            Already have an account? <a href="login.html">Login</a>
          </p>

        </div>
      </div>
    </section>
  </main>

  <script src="js/service-data.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
